name: Nexus AutoForge AI CI

on:
  push:
    branches:
      - main
      - "release/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  verify:

    name: AutoForge Verify

    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Permissions
        run: |
          chmod +x nexus.py
          chmod +x bin/nexus
          chmod +x bin/repair-bot
          chmod +x tests/test.sh
          chmod +x tests/import-regression.py
          chmod +x tests/security-regression.py

      - name: Python compile
        run: |
          python -m py_compile \
            nexus.py \
            nexuslib/core.py \
            tests/import-regression.py \
            tests/security-regression.py

      - name: Import regression
        run: |
          python tests/import-regression.py |
          grep -q "IMPORT REGRESSION PASS"

      - name: Shell syntax
        run: |
          bash -n bin/nexus
          bash -n bin/repair-bot
          bash -n tests/test.sh

      - name: Selftest
        run: |
          python nexus.py selftest

      - name: Architect
        run: |
          python nexus.py create \
            "AutoForge CI Project" |
          jq -e \
            '.name == "autoforge-ci-project"'

      - name: Security regression
        run: |
          python tests/security-regression.py |
          jq -e \
            '.status == "PASS"'

      - name: Security audit
        run: |
          python nexus.py audit |
          tee /tmp/audit.json

          jq -e \
            '.security == "PASS"' \
            /tmp/audit.json

      - name: Complete tests
        run: |
          ./tests/test.sh

      - name: PASS
        run: |
          echo "================================"
          echo "✅ NEXUS AUTOFORGE CI PASS"
          echo "================================"
